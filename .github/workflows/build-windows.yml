
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\WiFiHotspotManager.sln

      - name: Publish EXE
        run: dotnet publish .\WiFiHotspotManager\WiFiHotspotManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: WiFiHotspotManager-win-x64
          path: publish/
